[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sam2-video-annotator"
version = "0.1.0"
description = "Interactive semi-automatic UAV video annotation using SAM2 propagation"
requires-python = ">=3.10"
dependencies = ["numpy", "opencv-python", "PyYAML"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
